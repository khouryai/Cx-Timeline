# Run the whole suite on every push.
#
# A push to the default branch reaches every installed desktop copy — once this
# passes, `.github/workflows/kit.yml` writes the `desktop-kit` branch the
# installed copies update from. A red run here is therefore what stops a broken
# build reaching anybody.
#
# Several jobs rather than one, because they need different machines and fail
# for different reasons: a browser suite failing tells you about the
# application, the Rust tests about the folder rules, and the bundle check that
# somebody edited `src/` and forgot to build.

name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The rule that bites, as a check. `index.html` loads `app.bundle.js`, not
  # `src/`, so a change to the source that is not rebuilt ships a site that
  # disagrees with its own repository. The build is deterministic apart from
  # the timestamp in its header, which is why that one line is excluded.
  bundle:
    name: The bundle matches the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild
        run: node tools/build.js
      - name: Compare against what is committed
        run: |
          # `grep -a`, not plain grep: the bundle carries bytes grep reads as
          # binary, and it then prints "binary file matches" instead of the
          # lines — which makes the comparison always succeed and the check
          # worthless in exactly the case it exists for.
          strip() { grep -av '^ \* Modules:' "$1"; }
          # Two bundles: the application and the calendar it loads on first use
          # — a stale one ships an app that disagrees with its source. Every
          # stale one is reported, not just the first.
          status=0
          for bundle in app.bundle.js calendar.bundle.js; do
            git show "HEAD:$bundle" > "/tmp/committed-$bundle"
            if ! diff <(strip "/tmp/committed-$bundle") <(strip "$bundle") > /dev/null; then
              echo "::error::$bundle is out of date — run 'npm run build' and commit it"
              diff <(strip "/tmp/committed-$bundle") <(strip "$bundle") | head -40
              status=1
            else
              echo "$bundle: the committed bundle is the source, built"
            fi
          done
          exit $status

  # The rules that catch a mistake rather than a preference — a name nothing
  # defines, an import nothing reads, dead code (eslint.config.js) — and the
  # JSDoc read as types (tsconfig.json): a call with the wrong arguments, an
  # option nobody documented. No build step: nothing is emitted, the bundle is
  # still the linker's.
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm run typecheck

  # This job needs `package-lock.json` committed, and for a long time it was
  # not: `.gitignore` held it, so `cache: npm` failed at setup, every suite step
  # was *skipped*, and the run went red in forty seconds looking exactly like a
  # test failure. A red tick that never ran the tests is worse than no tick at
  # all — it was reporting on nothing while the suites went unrun on every push.
  browser:
    name: Browser and deployment suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the runners deprecated Node 20 and are already forcing
          # the actions themselves onto a newer one, and 22 is what the suites
          # are developed against.
          node-version: '22'
          cache: npm
      - run: npm ci
      # Playwright resolves its own browser when nothing is pinned — see
      # tools/lib/chrome.js. Only Chromium is used, so only Chromium is fetched.
      - run: npx playwright install --with-deps chromium

      # Side by side, where two suites do not share a directory — see the lanes
      # in tools/run_tests.js. The clock is pinned to a Wednesday (tools/lib/clock.js),
      # so a run on a Sunday is the same run as one on a Tuesday.
      - name: Every browser and Node suite
        run: >-
          node tools/run_tests.js test_kit test_lookahead test_folder_rules test_la_edit test_tawr test_rc_db
          smoke smoke_folder smoke_desktop smoke_calendar
      # …and the calendar once more on a Monday, the day its date arithmetic has
      # gone wrong on before: yesterday is a Friday, and the week under review
      # is not the week on screen.
      - name: The calendar, on a Monday
        env:
          CX_TEST_NOW: '2026-09-21T08:00:00Z'
        run: node tools/run_tests.js smoke_calendar

      # A picture of the failure is worth more than the log when a layout
      # check goes red.
      - name: Screenshot on failure
        if: failure()
        run: node tools/smoke.js --shot failure.png || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshot
          path: failure.png
          if-no-files-found: ignore

  # The Excel export, opened and re-saved by a spreadsheet program that did not
  # write it. Microsoft Excel does not run on these runners; LibreOffice Calc is
  # the nearest independent reader that does.
  xlsx:
    name: The Excel export opens in a spreadsheet program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # A package mirror that stops answering held this step for over half an
      # hour once, and with it the deploy: each attempt gets five minutes, and
      # a stuck one is tried again rather than waited on for six hours.
      - name: Install LibreOffice Calc
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libreoffice-calc \
              && exit 0
            echo "Attempt $attempt to install LibreOffice Calc did not finish; trying again."
          done
          exit 1
      - run: node tools/test_xlsx_compat.js

  rust:
    name: Plan and lock rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No webview and no display: plan.rs is a Tauri-free library on purpose,
      # which is what makes the rules that protect somebody's afternoon
      # checkable in seconds.
      - name: Test the library
        working-directory: src-tauri
        run: cargo test --lib --no-default-features
